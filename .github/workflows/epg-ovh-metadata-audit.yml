name: EPG OVH - audit metadanych PLUS (bez publikacji)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/epg-ovh-metadata-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz kod formatera
        uses: actions/checkout@v4
      - name: Wykonaj testy jednostkowe formatera
        run: python3 -m unittest discover -s tests -v
      - name: Pobierz oryginalne XMLTV+ z OVH
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 240 -o pltv.gz https://epg.ovh/pltv.gz
          gzip -t pltv.gz
      - name: Test pelnego formatowania na prawdziwym pliku bez publikacji
        run: |
          python3 scripts/format_plus.py --input pltv.gz --output pltv.check.gz --min-events 100000 --min-formatted 20000
          gzip -t pltv.check.gz
          python3 scripts/verify_plus.py pltv.gz pltv.check.gz --min-items 100000
          python3 - <<'PY'
          import gzip,xml.etree.ElementTree as ET
          with gzip.open('pltv.check.gz','rb') as f:
              for _,e in ET.iterparse(f,events=('end',)):
                  if e.tag!='programme':continue
                  if e.get('channel')=='Canal+ Premium' and 'Wiek:' in (e.findtext('desc') or ''):
                      print('PROBA PLUS:',e.findtext('title'),repr((e.findtext('desc') or '')[:220]))
                      print('PROBA DVB:', [c.text for c in e.findall('category')],e.findtext('rating/value'))
                      break
                  e.clear()
          PY
      - name: Sprawdz format surowych metadanych
        run: |
          python3 - <<'PY'
          import gzip, collections, xml.etree.ElementTree as ET
          selected={'Canal+ Premium', 'TVP 2', 'Canal+ 4K Ultra HD', 'Canal+ Extra 2'}
          shown=collections.Counter(); categories=collections.Counter(); nr=0
          with gzip.open('pltv.gz','rb') as f:
              for _,e in ET.iterparse(f,events=('end',)):
                  if e.tag!='programme': continue
                  nr+=1
                  c=(e.findtext('category') or '').strip()
                  if c: categories[c]+=1
                  cid=e.get('channel','')
                  if cid in selected and shown[cid]<2:
                      shown[cid]+=1
                      print('===',cid,repr(e.findtext('title')),'===')
                      for tag in ['title','sub-title','desc','category','date','episode-num','rating','star-rating','credits']:
                          n=e.find(tag)
                          print(tag,ET.tostring(n,encoding='unicode')[:650] if n is not None else '-')
                  e.clear()
          print('AUDYT: events',nr,'popular categories',categories.most_common(20))
          print('AUDYT: sample counts',dict(shown))
          PY
