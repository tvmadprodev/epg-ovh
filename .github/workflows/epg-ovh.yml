name: EPG OVH Polska - Standard, Plus i mapowanie Enigma2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/epg-ovh.yml'
  workflow_dispatch:
    inputs:
      rebuild_mapping:
        description: 'Odtworz mapowanie ze zweryfikowanych polskich referencji (tylko po recznym zatwierdzeniu)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC codziennie

permissions:
  contents: write

concurrency:
  group: epg-ovh-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REBUILD_MAPPING: ${{ inputs.rebuild_mapping || 'false' }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Uruchom testy mapowania
        run: python3 -m unittest discover -s tests -v
      - name: Pobierz oba zrodla XMLTV
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'pl.gz pl.gz' 'pltv.gz pltv.gz'; do
            set -- $pair
            echo "Pobieram https://epg.ovh/$1"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 10 --connect-timeout 20 --max-time 240 \
              --output "$2" "https://epg.ovh/$1"
            test "$(stat -c%s "$2")" -gt 100000
            gzip -t "$2"
            ls -lh "$2"
          done
      - name: Przygotuj mapowanie - tylko bootstrap albo reczny rebuild
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s mappings/ovh.channels.xml || "$REBUILD_MAPPING" == 'true' || "$GITHUB_EVENT_NAME" == 'push' ]]; then
            echo 'Tworze mapowanie z zatwierdzonej listy polskich referencji.'
            python3 scripts/build_mapping.py --pl pl.gz --pltv pltv.gz \
              --services data/polish_services.tsv \
              --variants data/verified_variants.tsv \
              --manual data/manual_ids.json \
              --out mappings/ovh.channels.xml --report reports/mapowanie.tsv
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mappings/ovh.channels.xml reports/mapowanie.tsv
            if ! git diff --cached --quiet; then
              git commit -m 'EPG OVH: zatwierdzone referencje polskich kanalow (bootstrap/rebuild)'
              git push origin HEAD:main
            fi
          else
            echo 'Mapowanie jest ZAMROZONE - nie jest zmieniane przy codziennej aktualizacji EPG.'
          fi
          test -s mappings/ovh.channels.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('mappings/ovh.channels.xml').getroot()
          assert root.tag=='channels'
          n=len(root.findall('channel'))
          assert n>=340, f'Too few mapped DVB refs in release r3: {n}'
          print('Zatwierdzone mapowania DVB:',n)
          PY
          cp mappings/ovh.channels.xml ovh.channels.xml
          gzip -n -9 -c mappings/ovh.channels.xml > ovh.channels.xml.gz
          gzip -t ovh.channels.xml.gz
          test -s ovh.channels.xml
      - name: Zbuduj instalator IPK r3
        shell: bash
        run: sh scripts/package_ipk.sh
      - name: Waliduj konfiguracje EPGImport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import xml.etree.ElementTree as ET
          for path in ('pl.gz','pltv.gz'):
              with gzip.open(path,'rb') as f:
                  event,root=next(ET.iterparse(f,events=('start',)))
                  assert root.tag=='tv', f'Not XMLTV: {path}'
          root=ET.parse('ovh.sources.xml').getroot()
          assert root.tag=='sources'
          assert len(root.findall('.//source'))==2
          assert len(root.findall('./mappings/channel'))==1
          assert root.find('./mappings/channel').get('name')=='ovh.channels.xml'
          assert all(s.get('channels')=='ovh.channels.xml' for s in root.findall('.//source'))
          ET.parse('ovh.channels.xml')
          print('Oba EPG, zrodla i mapowanie sa poprawne.')
          PY
          sha256sum pl.gz pltv.gz ovh.channels.xml ovh.channels.xml.gz ovh.sources.xml install_epg_ovh.sh epg-ovh-pl-installer_1.0-r3_all.ipk > SHA256SUMS.txt
      - name: Opublikuj stale adresy plikow w GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          TAG='epg-ovh'
          files=(pl.gz pltv.gz ovh.channels.xml ovh.channels.xml.gz ovh.sources.xml install_epg_ovh.sh epg-ovh-pl-installer_1.0-r3_all.ipk SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title 'Polskie EPG.OVH dla EPGImport (standard i plus)' \
              --notes 'EPG OVH standard i rozszerzone oraz zatwierdzona mapa referencji Hot Bird 13E. Dane EPG: epg.ovh (autorzy serwisu). Mapowanie: tvmadprodev.' \
              --latest
          fi
          echo "Gotowe: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
